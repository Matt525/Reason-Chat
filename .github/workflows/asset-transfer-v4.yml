name: CC0 car furniture lightpost transfer
on:
  pull_request:
    paths: [asset-transfer-trigger-v4.txt]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download public CC0 model packs
        run: |
          set -e
          mkdir -p transfer
          curl -fL 'https://www.kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/kenney_car-kit.zip' -o transfer/kenney_car-kit.zip
          curl -fL 'https://kenney.nl/media/pages/assets/furniture-kit/440e0608a4-1677580847/kenney_furniture-kit.zip' -o transfer/kenney_furniture-kit.zip
          curl -fL 'https://raw.githubusercontent.com/KenneyNL/Starter-Kit-City-Builder/4535092b740b378b700efd9df9e27a631815b84a/models/road-straight-lightposts.glb' -o transfer/road-straight-lightposts.glb
          curl -fL 'https://raw.githubusercontent.com/KenneyNL/Starter-Kit-City-Builder/4535092b740b378b700efd9df9e27a631815b84a/models/Textures/colormap.png' -o transfer/colormap.png
          sha256sum transfer/* > transfer/SHA256SUMS.txt
          find transfer -type f -printf '%s %p\n' | sort -n > transfer/FILE_SIZES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-district-model-packs-v4
          path: transfer
          compression-level: 0
          retention-days: 1
