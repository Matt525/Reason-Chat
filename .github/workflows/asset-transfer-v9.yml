name: Poly Haven hydrant dependencies corrected
on:
  pull_request:
    paths: [asset-transfer-trigger-v9.txt]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact API-declared dependencies
        run: |
          set -e
          mkdir -p transfer/textures
          curl -fL 'https://dl.polyhaven.org/file/ph-assets/Models/gltf/8k/fire_hydrant/fire_hydrant.bin' -o transfer/fire_hydrant.bin
          base='https://dl.polyhaven.org/file/ph-assets/Models/jpg/1k/fire_hydrant'
          for f in fire_hydrant_nor_gl_1k.jpg fire_hydrant_diff_1k.jpg fire_hydrant_arm_1k.jpg fire_hydrant_aged_nor_gl_1k.jpg fire_hydrant_aged_diff_1k.jpg fire_hydrant_aged_arm_1k.jpg; do curl -fL "$base/$f" -o "transfer/textures/$f"; done
          sha256sum transfer/fire_hydrant.bin transfer/textures/* > transfer/SHA256SUMS.txt
          find transfer -type f -printf '%s %p\n' | sort -n
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-district-hydrant-deps-v9
          path: transfer
          compression-level: 0
          retention-days: 1
