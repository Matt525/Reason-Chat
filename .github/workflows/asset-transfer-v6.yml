name: Poly Haven hydrant transfer
on:
  pull_request:
    paths: [asset-transfer-trigger-v6.txt]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download Poly Haven fire hydrant GLTF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse,zipfile,shutil
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'MidnightDistrict/6.0'})
              with urllib.request.urlopen(req,timeout=180) as r:return r.read()
          def flatten(v):
              if isinstance(v,str):return [v] if v.startswith('http') else []
              if isinstance(v,list):return sum((flatten(x) for x in v),[])
              if isinstance(v,dict):return sum((flatten(x) for x in v.values()),[])
              return []
          asset='fire_hydrant'
          meta=json.loads(fetch(f'https://api.polyhaven.com/files/{asset}'))
          candidates=[]
          for url in flatten(meta):
              s=url.lower()
              if ('gltf' not in s and not s.endswith('.glb')):continue
              score=(100 if '1k' in s else 40 if '2k' in s else 0)+(30 if s.endswith('.zip') else 20 if s.endswith('.glb') else 0)
              candidates.append((score,url))
          if not candidates:raise RuntimeError('No glTF URL in Poly Haven fire_hydrant metadata')
          url=max(candidates)[1]
          data=fetch(url);name=pathlib.Path(urllib.parse.urlparse(url).path).name or 'hydrant-package'
          pkg=pathlib.Path('transfer')/name;pkg.write_bytes(data)
          out=pathlib.Path('transfer/fire_hydrant');out.mkdir(parents=True,exist_ok=True)
          if zipfile.is_zipfile(pkg):
              with zipfile.ZipFile(pkg) as z:z.extractall(out)
          else:shutil.copy2(pkg,out/name)
          models=list(out.rglob('*.glb'))+list(out.rglob('*.gltf'))
          if not models:raise RuntimeError('Hydrant package contains no GLB/GLTF')
          pathlib.Path('transfer/SOURCE_URL.txt').write_text(url+'\nhttps://polyhaven.com/a/fire_hydrant\nCC0 1.0 Universal; attribution not required.\n')
          print(url)
          print('\n'.join(str(p) for p in models))
          PY
          find transfer -type f -printf '%s %p\n' | sort -n
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-district-hydrant-v6
          path: transfer
          compression-level: 0
          retention-days: 1
