name: CC0 asset transfer v2
on:
  pull_request:
    paths: [asset-transfer-trigger-v2.txt]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download public CC0 asset archives
        run: |
          set -e
          mkdir -p transfer
          curl -fL 'https://kenney.nl/media/pages/assets/city-kit-commercial/a742d900eb-1753115042/kenney_city-kit-commercial_2.1.zip' -o transfer/kenney_city-kit-commercial_2.1.zip
          curl -fL 'https://www.kenney.nl/media/pages/assets/city-kit-industrial/5fcb837741-1750838303/kenney_city-kit-industrial_1.0.zip' -o transfer/kenney_city-kit-industrial_1.0.zip
          curl -fL 'https://www.kenney.nl/media/pages/assets/building-kit/0de7aaa492-1743244741/kenney_building-kit.zip' -o transfer/kenney_building-kit.zip
          curl -fL 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/urban_street_03_2k.hdr' -o transfer/urban_street_03_2k.hdr
          sha256sum transfer/* > transfer/SHA256SUMS.txt
          du -h transfer/*
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-district-real-assets-v2
          path: transfer
          compression-level: 0
          retention-days: 1
