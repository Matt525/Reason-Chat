name: Temporary CC0 asset transfer

on:
  pull_request:
    paths:
      - asset-transfer-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and inventory real assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/assets/models transfer/assets/textures transfer/assets/hdri
          cat > /tmp/download_assets.py <<'PY'
          import hashlib, json, os, re, shutil, struct, sys, tempfile, zipfile
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          ROOT = Path('transfer/assets')
          inventory = []

          def get_bytes(url):
              req = Request(url, headers={'User-Agent':'Midnight-District-Asset-Transfer/1.0','Accept':'*/*'})
              with urlopen(req, timeout=120) as r:
                  return r.read(), dict(r.headers)

          def save_bytes(data, dest):
              dest = Path(dest)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              return dest

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              return h.hexdigest()

          def image_resolution(path):
              p=Path(path)
              ext=p.suffix.lower()
              data=p.read_bytes()[:64]
              try:
                  if ext=='.png' and data[:8]==b'\x89PNG\r\n\x1a\n':
                      return f"{struct.unpack('>I',data[16:20])[0]}x{struct.unpack('>I',data[20:24])[0]}"
                  if ext in ('.jpg','.jpeg'):
                      b=p.read_bytes(); i=2
                      while i < len(b)-9:
                          if b[i] != 0xFF: i += 1; continue
                          marker=b[i+1]; i += 2
                          if marker in (0xD8,0xD9): continue
                          length=int.from_bytes(b[i:i+2],'big')
                          if marker in range(0xC0,0xC4):
                              return f"{int.from_bytes(b[i+5:i+7],'big')}x{int.from_bytes(b[i+3:i+5],'big')}"
                          i += length
                  if ext=='.hdr':
                      text=p.read_bytes()[:4096].decode('ascii','ignore')
                      m=re.search(r'[-+]Y\s+(\d+)\s+[-+]X\s+(\d+)',text)
                      if m: return f"{m.group(2)}x{m.group(1)}"
              except Exception:
                  pass
              return None

          def record(path, *, asset_type, source_url, source_page, license_name, attribution_required, resolution=None, package=None):
              p=Path(path)
              inventory.append({
                  'filename': str(p.relative_to(ROOT)),
                  'asset_type': asset_type,
                  'source_url': source_url,
                  'source_page': source_page,
                  'license': license_name,
                  'attribution_required': attribution_required,
                  'resolution': resolution or image_resolution(p),
                  'bytes': p.stat().st_size,
                  'size_mib': round(p.stat().st_size/1048576,3),
                  'sha256': sha256(p),
                  'package': package,
              })

          def download_direct(url, dest, **meta):
              data,_=get_bytes(url)
              p=save_bytes(data,dest)
              record(p, source_url=url, **meta)
              return p

          def flatten_urls(value, path=()):
              out=[]
              if isinstance(value,str) and value.startswith('http'):
                  out.append(('/'.join(path).lower(),value))
              elif isinstance(value,dict):
                  for k,v in value.items(): out.extend(flatten_urls(v,path+(str(k),)))
              elif isinstance(value,list):
                  for i,v in enumerate(value): out.extend(flatten_urls(v,path+(str(i),)))
              return out

          def polyhaven_metadata(asset_id):
              url=f'https://api.polyhaven.com/files/{asset_id}'
              data,_=get_bytes(url)
              return json.loads(data),url

          def pick_model_url(asset_id):
              meta,api_url=polyhaven_metadata(asset_id)
              candidates=[]
              for path,url in flatten_urls(meta):
                  value=(path+' '+url).lower()
                  if not any(x in value for x in ('gltf','.glb','.gltf')): continue
                  score=0
                  if '1k' in value: score+=100
                  if '2k' in value: score+=40
                  if 'gltf' in value: score+=50
                  if url.lower().endswith('.zip'): score+=30
                  if url.lower().endswith('.glb'): score+=25
                  if 'blend' in value or 'fbx' in value or 'usd' in value: score-=100
                  candidates.append((score,url,path))
              if not candidates:
                  raise RuntimeError(f'No glTF download found in Poly Haven API for {asset_id}')
              candidates.sort(reverse=True)
              return candidates[0][1],api_url,candidates[0][2]

          def download_polyhaven_model(asset_id, source_page):
              url,api_url,path_key=pick_model_url(asset_id)
              data,_=get_bytes(url)
              package_name=Path(urlparse(url).path).name or f'{asset_id}.download'
              package_path=save_bytes(data,ROOT/'models'/'packages'/package_name)
              record(package_path, asset_type='model-package', source_url=url, source_page=source_page, license_name='CC0 1.0 Universal', attribution_required=False, resolution='1K preferred', package=asset_id)
              outdir=ROOT/'models'/asset_id
              outdir.mkdir(parents=True,exist_ok=True)
              if zipfile.is_zipfile(package_path):
                  with zipfile.ZipFile(package_path) as z: z.extractall(outdir)
              else:
                  shutil.copy2(package_path,outdir/package_name)
              models=list(outdir.rglob('*.glb'))+list(outdir.rglob('*.gltf'))
              if not models: raise RuntimeError(f'{asset_id}: downloaded package contained no glTF/GLB')
              for p in sorted(outdir.rglob('*')):
                  if p.is_file():
                      record(p, asset_type='model-file' if p.suffix.lower() in ('.glb','.gltf') else 'model-resource', source_url=url, source_page=source_page, license_name='CC0 1.0 Universal', attribution_required=False, resolution='1K preferred', package=asset_id)
              primary=min(models,key=lambda p:(0 if p.suffix.lower()=='.glb' else 1,len(str(p))))
              return str(primary.relative_to(ROOT))

          def pick_texture_url(asset_id,map_kind,res='2k'):
              meta,api_url=polyhaven_metadata(asset_id)
              patterns={
                  'diffuse':['diff','diffuse','albedo'],
                  'normal':['nor_gl','normal_gl','normal'],
                  'roughness':['rough'],
                  'ao':['_ao','ambient_occlusion'],
                  'displacement':['disp','height'],
                  'metalness':['metal'],
              }[map_kind]
              candidates=[]
              for path,url in flatten_urls(meta):
                  value=(path+' '+url).lower()
                  if not url.lower().endswith(('.jpg','.jpeg','.png')): continue
                  if res not in value: continue
                  if not any(p in value for p in patterns): continue
                  if map_kind=='normal' and ('nor_dx' in value or 'directx' in value): continue
                  if map_kind=='ao' and ('arm' in value or 'ao_rough' in value): continue
                  score=0
                  if '/jpg/' in url.lower() or url.lower().endswith('.jpg'): score+=20
                  if f'_{res}' in value: score+=15
                  if patterns[0] in value: score+=10
                  candidates.append((score,url,path))
              if not candidates: raise RuntimeError(f'No {res} {map_kind} map for {asset_id}')
              candidates.sort(reverse=True)
              return candidates[0][1],api_url

          def download_texture_set(asset_id,local_name,maps):
              page=f'https://polyhaven.com/a/{asset_id}'
              for kind in maps:
                  url,api=pick_texture_url(asset_id,kind,'2k')
                  ext=Path(urlparse(url).path).suffix or '.jpg'
                  dest=ROOT/'textures'/local_name/f'{kind}{ext}'
                  download_direct(url,dest,asset_type='texture-map',source_page=page,license_name='CC0 1.0 Universal',attribution_required=False,resolution='2048x2048',package=local_name)

          # Kenney real GLB buildings and a real vehicle model.
          kenney_city='https://github.com/KenneyNL/Starter-Kit-City-Builder'
          city_raw='https://raw.githubusercontent.com/KenneyNL/Starter-Kit-City-Builder/4535092b740b378b700efd9df9e27a631815b84a/models'
          for name in ['building-small-a.glb','building-small-b.glb','building-small-c.glb','building-small-d.glb','building-garage.glb','road-straight-lightposts.glb']:
              download_direct(f'{city_raw}/{name}',ROOT/'models'/'kenney_city'/name,asset_type='model-file',source_page=kenney_city,license_name='CC0 1.0 Universal',attribution_required=False,resolution=None,package='kenney_city')
          download_direct(f'{city_raw}/Textures/colormap.png',ROOT/'models'/'kenney_city'/'Textures'/'colormap.png',asset_type='model-resource',source_page=kenney_city,license_name='CC0 1.0 Universal',attribution_required=False,resolution=None,package='kenney_city')

          sedan_url='https://raw.githubusercontent.com/kidscancode/3d_car_sphere/e467b25d7979fcc12b590ba23e96bf1e4a2824e6/assets/kenney_car_kit/sedan.glb'
          download_direct(sedan_url,ROOT/'models'/'kenney_car'/'sedan.glb',asset_type='model-file',source_page='https://kenney.nl/assets/car-kit',license_name='CC0 1.0 Universal',attribution_required=False,resolution=None,package='kenney_car')

          # High-fidelity Poly Haven model packages, using the smallest 1K glTF choice exposed by the API.
          model_ids=['modular_urban_apartments_facade','fire_hydrant','street_lamp_01','modular_street_seating','metal_trash_can','trashbag']
          primaries={}
          for asset_id in model_ids:
              primaries[asset_id]=download_polyhaven_model(asset_id,f'https://polyhaven.com/a/{asset_id}')

          # Photoscanned 2K PBR sets.
          texture_specs=[
              ('worn_asphalt','asphalt',['diffuse','normal','roughness','ao','displacement']),
              ('concrete_tiles_02','pavement',['diffuse','normal','roughness','ao','displacement']),
              ('worn_brick_wall','brick',['diffuse','normal','roughness','ao','displacement']),
              ('concrete_layers_02','concrete',['diffuse','normal','roughness','ao','displacement']),
              ('rusty_metal_02','rusty_metal',['diffuse','normal','roughness','ao','metalness']),
          ]
          for spec in texture_specs: download_texture_set(*spec)

          # Local 2K HDRI only; hard fail if larger than 2K or over 10 MiB.
          hdri_url='https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/urban_street_03_2k.hdr'
          hdri=download_direct(hdri_url,ROOT/'hdri'/'urban_street_03_2k.hdr',asset_type='hdri',source_page='https://polyhaven.com/a/urban_street_03',license_name='CC0 1.0 Universal',attribution_required=False,resolution='2048x1024',package='urban_street_03')
          if hdri.stat().st_size > 10*1024*1024: raise RuntimeError(f'HDRI exceeds 10 MiB: {hdri.stat().st_size}')
          actual=image_resolution(hdri)
          if actual and actual!='2048x1024': raise RuntimeError(f'HDRI is not 2K: {actual}')

          (ROOT/'model-primary-paths.json').write_text(json.dumps(primaries,indent=2))
          inventory.sort(key=lambda x:x['filename'])
          Path('transfer/asset-inventory.json').write_text(json.dumps(inventory,indent=2))
          Path('transfer/ASSET_LICENSES.md').write_text('# Asset licenses\n\n- Poly Haven assets: CC0 1.0 Universal; attribution not required.\n- Kenney assets: CC0 1.0 Universal; attribution not required.\n- Sketchfab assets used: none.\n')
          print(json.dumps({'files':len(inventory),'bytes':sum(x['bytes'] for x in inventory),'primaries':primaries},indent=2))
          PY
          python /tmp/download_assets.py
          find transfer -type f -printf '%s %p\n' | sort -n
      - name: Upload real asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: midnight-district-real-assets
          path: transfer
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
