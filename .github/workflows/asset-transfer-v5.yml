name: CC0 photoscan texture transfer
on:
  pull_request:
    paths: [asset-transfer-trigger-v5.txt]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download 2K Poly Haven photoscan maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          python - <<'PY'
          import json, pathlib, urllib.request, hashlib
          root=pathlib.Path('transfer')
          specs={
            'asphalt':'worn_asphalt',
            'pavement':'concrete_pavement',
            'brick':'worn_brick_wall'
          }
          suffixes={'diff':'diffuse','nor_gl':'normal','rough':'roughness','ao':'ao','disp':'displacement'}
          inventory=[]
          for local,asset in specs.items():
              for suffix,name in suffixes.items():
                  url=f'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/{asset}/{asset}_{suffix}_2k.jpg'
                  req=urllib.request.Request(url,headers={'User-Agent':'MidnightDistrict/5.0'})
                  with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
                  p=root/f'textures/{local}/{name}.jpg';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
                  inventory.append({'filename':str(p.relative_to(root)),'source_url':url,'source_page':f'https://polyhaven.com/a/{asset}','resolution':'2048x2048','bytes':len(data),'size_mib':round(len(data)/1048576,3),'sha256':hashlib.sha256(data).hexdigest(),'license':'CC0 1.0 Universal','attribution_required':False})
          (root/'texture-inventory.json').write_text(json.dumps(inventory,indent=2))
          PY
          find transfer -type f -printf '%s %p\n' | sort -n
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-district-photoscans-v5
          path: transfer
          compression-level: 0
          retention-days: 1
