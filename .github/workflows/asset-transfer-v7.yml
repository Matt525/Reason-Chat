name: Poly Haven hydrant dependencies
on:
  pull_request:
    paths: [asset-transfer-trigger-v7.txt]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download hydrant binary and 1K textures
        run: |
          set -e
          base='https://dl.polyhaven.org/file/ph-assets/Models/gltf/1k/fire_hydrant'
          mkdir -p transfer/textures
          curl -fL "$base/fire_hydrant.bin" -o transfer/fire_hydrant.bin
          for f in fire_hydrant_nor_gl_1k.jpg fire_hydrant_diff_1k.jpg fire_hydrant_arm_1k.jpg fire_hydrant_aged_nor_gl_1k.jpg fire_hydrant_aged_diff_1k.jpg fire_hydrant_aged_arm_1k.jpg; do curl -fL "$base/textures/$f" -o "transfer/textures/$f"; done
          sha256sum transfer/fire_hydrant.bin transfer/textures/* > transfer/SHA256SUMS.txt
          find transfer -type f -printf '%s %p\n' | sort -n
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-district-hydrant-deps-v7
          path: transfer
          compression-level: 0
          retention-days: 1
